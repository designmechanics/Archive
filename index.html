<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Archive — Personal Asset & UI-Effects Library</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg: #10161d;
        --surface: #1b242e;
        --ink: #e9edf2;
        --inkc: 233, 237, 242;
        --well: #0b1016;
        --tint: #233447;
        --tint-ink: #b5d9fd;
        --rail: #1a2a3b;
        --accent: #2c455d;
      }
      * {
        box-sizing: border-box;
      }
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
        color: var(--ink);
        font-family: Barlow, system-ui, -apple-system, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      ::selection {
        background: rgba(89, 128, 166, 0.3);
      }
      :focus {
        outline: none;
      }
      :focus-visible {
        outline: 2px solid #5980a6;
        outline-offset: 2px;
      }
      [data-scroll]::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }
      [data-scroll]::-webkit-scrollbar-thumb {
        background: rgba(var(--inkc), 0.18);
        border-radius: 99px;
        border: 3px solid transparent;
        background-clip: padding-box;
      }
      @keyframes idxpulse {
        0%, 100% { opacity: 0.35; }
        50% { opacity: 1; }
      }
      @keyframes panelBackdropFadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
