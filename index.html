<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Archive — All of your media, all in one place.</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700;800;900&family=Pinyon+Script&family=Great+Vibes&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var validList = [
            '/backgrounds/logo_bg_1.jpg',
            '/backgrounds/logo_bg_2.jpg',
            '/backgrounds/logo_bg_3.jpg',
            '/backgrounds/logo_bg_4.jpg',
            '/backgrounds/logo_bg_5.jpg'
          ];
          // Always select a fresh random artwork differing from the last loaded one
          var last = sessionStorage.getItem('archive_last_session_bg') || localStorage.getItem('archive_last_bg');
          var pool = validList.filter(function(item) { return item !== last; });
          if (!pool || pool.length === 0) pool = validList;
          var chosen = pool[Math.floor(Math.random() * pool.length)];

          sessionStorage.setItem('archive_session_bg', chosen);
          sessionStorage.setItem('archive_last_session_bg', chosen);
          localStorage.setItem('archive_last_bg', chosen);

          document.documentElement.style.setProperty('--session-bg', 'url(' + chosen + ')');
          window.__SESSION_BG__ = chosen;
        } catch (e) {
          document.documentElement.style.setProperty('--session-bg', 'url(/backgrounds/logo_bg_3.jpg)');
        }
      })();
    </script>
    <style>
      :root {
        --bg: #10161d;
        --surface: #1b242e;
        --ink: #e9edf2;
        --inkc: 233, 237, 242;
        --well: #0b1016;
        --tint: #233447;
        --tint-ink: #b5d9fd;
        --rail: #1a2a3b;
        --rail-ink: #e9edf2;
        --rail-border: rgba(255, 255, 255, 0.08);
        --accent: #2c455d;
        --rail-width: 252px;
      }
      * {
        box-sizing: border-box;
      }
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
        color: var(--ink);
        font-family: Barlow, system-ui, -apple-system, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      ::selection {
        background: rgba(89, 128, 166, 0.3);
      }
      :focus {
        outline: none;
      }
      :focus-visible {
        outline: 2px solid #5980a6;
        outline-offset: 2px;
      }
      [data-scroll]::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }
      [data-scroll]::-webkit-scrollbar-thumb {
        background: rgba(var(--inkc), 0.18);
        border-radius: 99px;
        border: 3px solid transparent;
        background-clip: padding-box;
      }
      @keyframes idxpulse {
        0%, 100% { opacity: 0.35; }
        50% { opacity: 1; }
      }
      @keyframes panelBackdropFadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      @keyframes slideUpNotif {
        from {
          opacity: 0;
          transform: translateY(16px) scale(0.96);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }
      @keyframes slideDownZipBanner {
        from {
          opacity: 0;
          transform: translateY(-10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes watermarkFadeScale {
        0% {
          opacity: 0;
          transform: scale(0.93);
        }
        100% {
          opacity: 0.10;
          transform: scale(1);
        }
      }
      @keyframes scriptFadeScale {
        0% {
          opacity: 0;
          transform: translateX(-50%) scale(0.95);
        }
        100% {
          opacity: 0.50;
          transform: translateX(-50%) scale(1);
        }
      }
      .watermark-backdrop {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        pointer-events: none;
        z-index: 0;
        user-select: none;
        overflow: hidden;
        perspective: 1200px;
        perspective-origin: 50% 50%;
        transform-style: preserve-3d;
      }
      .watermark-glyph {
        font-family: 'Barlow Condensed', sans-serif;
        font-weight: 900;
        font-size: 128vh;
        line-height: 1;
        margin-top: -13.5vh;
        color: var(--ink, #e9edf2);
        text-align: center;
        letter-spacing: -0.02em;
        text-transform: uppercase;
        white-space: nowrap;
        opacity: 0.10;
        z-index: 1;
        transform: translateZ(0);
      }
      .watermark-script {
        position: absolute;
        bottom: 2vh;
        left: 50%;
        transform: translateX(-50%) translateZ(20px);
        font-family: 'Pinyon Script', 'Great Vibes', 'Edwardian Script ITC', 'Bickham Script Pro', 'Snell Roundhand', cursive;
        font-weight: 400;
        font-size: 25vh;
        line-height: 1;
        color: var(--ink, #e9edf2);
        text-align: center;
        letter-spacing: normal;
        white-space: nowrap;
        pointer-events: none;
        user-select: none;
        z-index: 2;
        opacity: 0.50;
      }

      /* ================= Responsive Scaling for 1080p and Smaller ================= */
      @media (max-width: 1920px) {
        :root {
          --rail-width: 195px;
          --app-font-size: 13.5px;
        }

        /* 1. Sidemenu (Left Rail) Width, Fonts & Line Heights */
        aside[data-rail="1"] {
          width: 195px !important;
          min-width: 195px !important;
          max-width: 195px !important;
        }
        aside[data-rail="1"] > div:first-child {
          padding: 12px 14px 8px !important;
          gap: 3px !important;
        }
        aside[data-rail="1"] > div:first-child [data-intro="1"]:last-child {
          font-size: 8.5px !important;
          letter-spacing: .08em !important;
        }

        /* Indexing status card */
        aside[data-rail="1"] > div[data-intro="1"] {
          margin: 0 10px 8px !important;
          padding: 6px 9px !important;
          gap: 4px !important;
          border-radius: 9px !important;
        }
        aside[data-rail="1"] > div[data-intro="1"] div {
          font-size: 8px !important;
        }

        /* Scrollable Navigation / Pools area */
        aside[data-rail="1"] div[data-scroll="1"] {
          padding: 0 8px 8px !important;
        }

        /* Section headers (Pools, Watched folders) */
        aside[data-rail="1"] div[data-scroll="1"] > div[data-intro="1"] {
          padding: 4px 6px !important;
          font-size: 8px !important;
          margin-top: 4px !important;
        }

        /* Everything Button */
        aside[data-rail="1"] button[data-intro="1"] {
          padding: 5px 8px !important;
          margin-bottom: 2px !important;
          border-radius: 8px !important;
          gap: 6px !important;
          font-size: 12.5px !important;
          line-height: 1.15 !important;
        }
        aside[data-rail="1"] button[data-intro="1"] span:first-child {
          font-size: 12.5px !important;
          line-height: 1.15 !important;
        }
        aside[data-rail="1"] button[data-intro="1"] span:last-child {
          font-size: 8.5px !important;
        }

        /* Pool Rows & Buttons */
        aside[data-rail="1"] [data-pool] {
          margin-bottom: 1.5px !important;
        }
        aside[data-rail="1"] [data-pool] > button {
          padding: 4.5px 7px !important;
          border-radius: 8px !important;
          gap: 6px !important;
          font-size: 12px !important;
          line-height: 1.15 !important;
        }
        aside[data-rail="1"] [data-pool] > button span:nth-child(1) {
          width: 5px !important;
          height: 5px !important;
        }
        aside[data-rail="1"] [data-pool] > button span:nth-child(2) {
          font-size: 12px !important;
          line-height: 1.15 !important;
        }
        aside[data-rail="1"] [data-pool] > button span:nth-child(3) {
          font-size: 8.5px !important;
        }
        aside[data-rail="1"] [data-pool] > button span:nth-child(4) {
          width: 17px !important;
          height: 17px !important;
          font-size: 9.5px !important;
          border-radius: 5px !important;
        }

        /* Watched Folder Items */
        aside[data-rail="1"] [data-folder] {
          padding: 4px 7px !important;
          margin-bottom: 2px !important;
          gap: 6px !important;
          border-radius: 8px !important;
          font-size: 9px !important;
          line-height: 1.15 !important;
        }
        aside[data-rail="1"] [data-folder] span:nth-of-type(1) {
          font-size: 8.5px !important;
        }
        aside[data-rail="1"] [data-folder] span:nth-of-type(2) {
          font-size: 8px !important;
        }

        /* + Add folder button */
        aside[data-rail="1"] div[data-scroll="1"] > button:last-of-type {
          padding: 5px 8px !important;
          font-size: 11px !important;
          line-height: 1.2 !important;
          margin-top: 4px !important;
          border-radius: 8px !important;
        }

        /* SQLite Database Card */
        aside[data-rail="1"] div[data-scroll="1"] > div:last-child {
          margin-top: 8px !important;
          padding: 6px 9px !important;
          border-radius: 9px !important;
          gap: 4px !important;
        }
        aside[data-rail="1"] div[data-scroll="1"] > div:last-child * {
          font-size: 8px !important;
        }
        aside[data-rail="1"] div[data-scroll="1"] > div:last-child button {
          padding: 3px 6px !important;
          font-size: 8px !important;
        }

        /* 2. Top Header Bar */
        header {
          padding: 10px 18px 8px !important;
          gap: 10px !important;
        }
        header input {
          padding: 7px 12px 7px 32px !important;
          font-size: 12px !important;
          border-radius: 9px !important;
        }
        header button {
          padding: 5px 9px !important;
          font-size: 11px !important;
          border-radius: 8px !important;
        }
        header span[data-intro="1"] {
          font-size: 9px !important;
        }

        /* 3. Toolbar Controls */
        [data-toolbar="1"] {
          padding: 0 18px 10px !important;
          gap: 6px !important;
        }
        /* View Switcher buttons */
        [data-toolbar="1"] > div:first-child button {
          padding: 4px 8px !important;
          font-size: 11px !important;
          border-radius: 7px !important;
          letter-spacing: .03em !important;
        }
        /* Density buttons */
        [data-density="1"] button {
          padding: 3px 7px !important;
          font-size: 10px !important;
        }
        /* Sort buttons */
        [data-sort-selector="1"] > div {
          gap: 4px !important;
        }
        [data-sort-selector="1"] button {
          padding: 4px 8px !important;
          font-size: 10.5px !important;
          border-radius: 7px !important;
        }
        /* Pagination buttons */
        [data-page-nav="1"] button {
          padding: 3px 6px !important;
          font-size: 10px !important;
        }
        [data-max-per-page="1"] button {
          padding: 3px 6px !important;
          font-size: 10px !important;
        }

        /* 4. Stage & Card Content */
        div[data-wrap="1"] {
          padding: 4px 18px 80px !important;
        }
        /* Card Title */
        div[data-card] div[data-reveal="1"] > div > div:last-child > div:first-child {
          font-size: 14px !important;
          line-height: 1.15 !important;
        }
        /* Card footer container */
        div[data-card] div[data-reveal="1"] > div > div:last-child {
          padding: 7px 9px 8px !important;
          gap: 5px !important;
        }
        /* Card tag chips */
        div[data-card] div[data-reveal="1"] > div > div:last-child > div:nth-child(2) span {
          padding: 2px 6px !important;
          font-size: 8px !important;
          letter-spacing: .02em !important;
        }
        /* Card byline */
        div[data-card] div[data-reveal="1"] > div > div:last-child > div:last-child {
          font-size: 8px !important;
          gap: 6px !important;
        }
        div[data-card] div[data-reveal="1"] > div > div:last-child > div:last-child span:last-child {
          padding: 2px 5px !important;
          font-size: 8px !important;
        }

        /* Card badges on thumbnail */
        div[data-card] span[style*="position: absolute"] {
          font-size: 8px !important;
        }
        div[data-card] span[style*="position: absolute"][style*="left: 10px"] {
          padding: 2px 5px !important;
          font-size: 7.5px !important;
          top: 6px !important;
          left: 6px !important;
        }
        div[data-card] span[style*="position: absolute"][style*="right: 38px"] {
          padding: 2px 5px !important;
          font-size: 7.5px !important;
          top: 5px !important;
          right: 30px !important;
        }
        div[data-card] span[style*="position: absolute"][style*="right: 8px"] {
          width: 20px !important;
          height: 20px !important;
          font-size: 11px !important;
          top: 5px !important;
          right: 6px !important;
        }

        /* 5. List View Table */
        div[data-list="1"] > div:first-child {
          padding: 5px 10px !important;
          font-size: 8px !important;
          gap: 10px !important;
        }
        div[data-list="1"] div[data-row] {
          padding: 5px 10px !important;
          gap: 10px !important;
          border-radius: 9px !important;
        }
        div[data-list="1"] div[data-row] > span:nth-child(1) {
          width: 32px !important;
          height: 26px !important;
        }
        div[data-list="1"] div[data-row] > span:nth-child(2) {
          font-size: 11px !important;
        }
        div[data-list="1"] div[data-row] > span:nth-child(3) {
          font-size: 13.5px !important;
        }
        div[data-list="1"] div[data-row] > span:nth-child(4),
        div[data-list="1"] div[data-row] > span:nth-child(5),
        div[data-list="1"] div[data-row] > span:nth-child(6),
        div[data-list="1"] div[data-row] > span:nth-child(7),
        div[data-list="1"] div[data-row] > span:nth-child(8) {
          font-size: 8.5px !important;
        }

        /* 6. Background Watermark */
        .watermark-glyph {
          font-size: 88vh !important;
          margin-top: -9vh !important;
        }
        .watermark-script {
          font-size: 18vh !important;
          bottom: 2vh !important;
        }

        /* 7. SidePanel (Docked Preview) */
        div[data-panel="1"] {
          min-width: 480px !important;
        }
        div[data-panel="1"] > div:first-child {
          padding: 10px 14px 8px !important;
          gap: 6px !important;
        }
        div[data-panel="1"] > div:first-child [style*="font-size: 26px"] {
          font-size: 20px !important;
        }
        div[data-panel="1"] > div:first-child button {
          height: 28px !important;
          font-size: 10px !important;
        }
      }

      /* ================= Extra Scaling for Laptop & Compact Screens (<= 1440px) ================= */
      @media (max-width: 1440px) {
        :root {
          --rail-width: 175px;
          --app-font-size: 12.5px;
        }

        aside[data-rail="1"] {
          width: 175px !important;
          min-width: 175px !important;
          max-width: 175px !important;
        }
        aside[data-rail="1"] [data-pool] > button span:nth-child(2) {
          font-size: 11px !important;
        }
        aside[data-rail="1"] button[data-intro="1"] span:first-child {
          font-size: 11.5px !important;
        }
        div[data-card] div[data-reveal="1"] > div > div:last-child > div:first-child {
          font-size: 13px !important;
        }
        [data-toolbar="1"] > div:first-child button {
          padding: 3px 6px !important;
          font-size: 10px !important;
        }
      }

      /* ================= Session Background Artwork & Immediate Loader ================= */
      #app-session-bg {
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        background-image: var(--session-bg, none);
        background-size: cover;
        background-position: center center;
        background-repeat: no-repeat;
        opacity: 0.085;
        filter: saturate(1.1) contrast(1.05);
        transition: opacity 0.5s ease;
      }
      html[data-theme="light"] #app-session-bg {
        opacity: 0.045;
        mix-blend-mode: multiply;
      }
      html[data-theme="mid"] #app-session-bg {
        opacity: 0.07;
      }
      html[data-theme="dark"] #app-session-bg {
        opacity: 0.095;
      }

      #app-loader {
        position: fixed;
        inset: 0;
        z-index: 999999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #090e14;
        transition: opacity 0.65s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.65s;
      }
      #app-loader.loaded {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      #app-loader-backdrop {
        position: absolute;
        inset: 0;
        background-image: var(--session-bg, none);
        background-size: cover;
        background-position: center center;
        background-repeat: no-repeat;
        filter: brightness(0.4) saturate(1.2);
        transform: scale(1.01);
        transition: transform 1.2s cubic-bezier(0.16, 1, 0.3, 1);
      }
      #app-loader.loaded #app-loader-backdrop {
        transform: scale(1.06);
      }
      #app-loader-vignette {
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at center, rgba(9, 14, 20, 0.45) 0%, rgba(9, 14, 20, 0.88) 100%);
      }
      #app-loader-card {
        position: relative;
        z-index: 2;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 34px 44px;
        border-radius: 22px;
        background: rgba(14, 22, 32, 0.78);
        border: 1px solid rgba(148, 188, 227, 0.22);
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.75), 0 0 36px rgba(89, 128, 166, 0.18);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        text-align: center;
        max-width: 420px;
        margin: 20px;
        animation: appLoaderCardIn 0.5s cubic-bezier(0.16, 1, 0.3, 1);
      }
      @keyframes appLoaderCardIn {
        from { opacity: 0; transform: translateY(14px) scale(0.96); }
        to { opacity: 1; transform: translateY(0) scale(1); }
      }
      .app-loader-logo {
        font-family: 'Barlow Condensed', sans-serif;
        font-size: 38px;
        font-weight: 800;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #e9edf2;
        text-shadow: 0 0 24px rgba(181, 217, 253, 0.45);
        margin-bottom: 4px;
      }
      .app-loader-tagline {
        font-family: Barlow, sans-serif;
        font-size: 13px;
        color: rgba(233, 237, 242, 0.75);
        margin-bottom: 22px;
        letter-spacing: 0.02em;
      }
      .app-loader-progress {
        width: 180px;
        height: 3px;
        border-radius: 99px;
        background: rgba(255, 255, 255, 0.12);
        overflow: hidden;
        margin-bottom: 12px;
        position: relative;
      }
      .app-loader-progress-fill {
        position: absolute;
        top: 0;
        left: 0;
        height: 100%;
        width: 45%;
        background: linear-gradient(90deg, #5980a6, #b5d9fd, #5980a6);
        border-radius: 99px;
        animation: appLoaderProgress 1.4s ease-in-out infinite;
      }
      @keyframes appLoaderProgress {
        0% { left: -45%; width: 45%; }
        50% { left: 25%; width: 65%; }
        100% { left: 100%; width: 45%; }
      }
      .app-loader-status {
        font-family: ui-monospace, Menlo, monospace;
        font-size: 10.5px;
        color: #94bce3;
        letter-spacing: 0.06em;
      }
    </style>
  </head>
  <body>
    <!-- Persistent Ambient Session Background (Super subtle backdrop) -->
    <div id="app-session-bg" aria-hidden="true"></div>

    <!-- Immediate Session Loading Screen -->
    <div id="app-loader" role="status" aria-live="polite">
      <div id="app-loader-backdrop"></div>
      <div id="app-loader-vignette"></div>
      <div id="app-loader-card">
        <div class="app-loader-logo">ARCHIVE</div>
        <div class="app-loader-tagline">All of your media, all in one place.</div>
        <div class="app-loader-progress">
          <div class="app-loader-progress-fill"></div>
        </div>
        <div class="app-loader-status">Initializing local engine · SQLite WAL…</div>
      </div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
